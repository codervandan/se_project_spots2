<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spots Project for card creation and deletions">
  <meta name="author" content="Daniel Quintana" />
  <meta name="keywords" content="HTML, CSS, JavaScript Card Creation Image Sharing">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Spots</title>
</head>
<body>
  <div class="page">
    <header class="header">
      <img src="<%=require('./images/logo.svg')%>" alt="Header Logo" class="header__logo">
    </header>
    <main class="content">
      <section class="profile page__section">
        <div class="profile__avatar-container">
          <img src="<%=require('./images/avatar.jpg')%>" alt="Current User" class="profile__avatar">
          <button type="button" class="profile__avatar-edit-btn">
          <img src="<%=require('./images/pencil-icon-group.svg')%>" alt="Edit avatar">
          </button>
        </div>
        <div class="profile__column">
          <h1 class="profile__name" required >Daniel Quintana</h1>
          <p class="profile__description" required >Software Engineer</p>
          <button type="button" class="profile__edit-btn">
            <img src="<%=require('./images/pencil-dark.svg')%>" alt="Edit Pencil Icon">Edit Profile
          </button>
        </div>
        <button type="button" class="profile__add-btn">
            <img src="<%=require('./images/plus.svg')%>" alt="Plus icon">New Post
          </button>
      </section>
      <section class="cards page__section">
        <ul class="cards__list">
          <template id="card-template">
            <li class="card">
              <button type="button" class="card__delete-btn"></button>
              <img src="" alt="" class="card__image">
              <div class="card__content">
                <h2 class="card__title"></h2>
                <button type="button" class="card__like-btn"></button>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </main>
    <footer class="footer"><img src="<%=require('./images/footer.svg')%>" alt="Footer" class="footer__image"></footer>
    <div class="modal" id="edit-profile-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">Edit profile</h2>
        <form class="modal__form" novalidate>
          <label for="profile-name-input" class="modal__label"> Name
            <input id="profile-name-input" type="text" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40 " required >
            <span id="profile-name-input-error" class="modal__error"> </span>
          </label>
          <label for="profile-description-input" class="modal__label"> Description
            <input id="profile-description-input" type="text" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required >
            <span id="profile-description-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__save-btn">Save</button>
        </form>
      </div>
    </div>
     <div class="modal" id="new-post-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">New post</h2>
        <form class="modal__form" novalidate>
          <label for="card-image-input" class="modal__label"> Image link
            <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required>
            <span id="card-image-input-error" class="modal__error"></span>
          </label>
          <label for="card-caption-input" class="modal__label"> Caption
            <input id="card-caption-input" type="text" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required>
            <span id="card-caption-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__save-btn">Save</button>
        </form>
      </div>
    </div>

    <!-- PREVIEW MODAL -->
     <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button type="button" class="modal__close-btn modal__close_type_preview"></button>
        <img src="#" alt="" class="modal__image">
        <p class="modal__caption"></p>
      </div>
    </div>
    <!-- EDITING AVATAR  -->
    <div class="modal" id="edit-avatar-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">Edit profile avatar</h2>
        <form class="modal__form" novalidate>
          <label class="modal__label">
            Profile Picture
            <input
              type="url"
              class="modal__input"
              id="avatar-input"
              placeholder="Paste the link to an image"
              required
            >
            <span class="modal__error" id="avatar-input-error"></span>
          </label>
          <button type="submit" class="modal__save-btn">Save</button>
        </form>
      </div>
    </div>
  <!-- DELETE CONFIRMATION MODAL -->
    <div class="modal" id="delete-modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn modal__close-btn_type_delete"></button>
        <h2 class="modal__title">Are you sure you want to delete this image?</h2>
        <form class="modal__form" novalidate>
          <p class="modal__text"></p>
          <div class="modal__actions">
            <button type="submit" class="modal__save-btn_delete modal__save-btn">Delete</button>
            <button type="button" class="modal__cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- <script type="module" src="./scripts/index.js"></script> -->
</body>
</html>
